name: Waka Readme

on:
  schedule:
    # 每天 UTC 0 点（北京时间 8 点）自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          # --- 必需的 Secrets ---
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # --- 本地化与格式 ---
          LOCALE: "zh"                     # 语言设置为中文
          SYMBOL_VERSION: "2"              # 进度条样式（1, 2, 或 3）

          # --- 开发者指标 (WakaTime) ---
          SHOW_OS: "True"                  # 显示操作系统
          SHOW_PROJECTS: "True"            # 显示项目
          SHOW_EDITORS: "True"             # 显示编辑器/IDE
          SHOW_LANGUAGE: "True"            # 显示编程语言
          SHOW_TOTAL_CODE_TIME: "True"     # 显示总编码时间

          # --- GitHub 活动与统计 ---
          SHOW_COMMIT: "True"              # 显示提交活动图
          SHOW_DAYS_OF_WEEK: "True"        # 显示一周内最活跃的日子
          SHOW_LANGUAGE_PER_REPO: "True"   # 显示每个仓库的语言分布
          SHOW_LOC_CHART: "False"          # 代码行数图表 (可按需开启)
          SHOW_PROFILE_VIEWS: "True"       # 显示个人主页访问量

          # --- 其他显示项 ---
          SHOW_SHORT_INFO: "False"         # 简短趣闻信息 (可按需开启)
          SHOW_LINES_OF_CODE: "True"       # 显示代码行数徽章
